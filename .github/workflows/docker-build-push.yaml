name: Build and Push Three Docker Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish_images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Generate Image Tag
        run: echo "IMAGE_TAG=dev-${GITHUB_SHA}" >> $GITHUB_ENV

      # Verify backend requirements file
      - name: Verify Backend Files
        run: |
          pwd
          ls -la
          ls -la ./backend
          test -f ./backend/requirements.txt

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-backend:${{ env.IMAGE_TAG }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-frontend:${{ env.IMAGE_TAG }}

      - name: Build and Push Database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-database:${{ env.IMAGE_TAG }}

      - name: Display Published Images
        run: |
          echo "Successfully published Docker images:"
          echo "${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-backend:${IMAGE_TAG}"
          echo "${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-frontend:${IMAGE_TAG}"
          echo "${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-database:${IMAGE_TAG}"
